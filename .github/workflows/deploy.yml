name: Deploy Terraform to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    name: Terraform Deploy to Azure

    env:
      # Credenciales de Azure para el proveedor
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      # Variables personalizadas
      UBUNTU_ADMIN_PASSWORD: ${{ secrets.UBUNTU_ADMIN_PASSWORD }}
      TF_VAR_admin_password: ${{ secrets.UBUNTU_ADMIN_PASSWORD }}
      TF_IN_AUTOMATION: true

      # Backend remoto (Azure Blob Storage con SAS)
      AZURE_STORAGE_ACCOUNT: terraformsdevops
      AZURE_STORAGE_CONTAINER: terraform
      AZURE_STORAGE_KEY: infraestructura.tfstate
      AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config --global user.name "Francisco Mateos"
          git config --global user.email "francisco.mateos@glinttglobal.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.4

      - name: Terraform Init (backend remoto)
        run: |
          terraform init \
            -backend-config="storage_account_name=${AZURE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${AZURE_STORAGE_CONTAINER}" \
            -backend-config="key=${AZURE_STORAGE_KEY}" \
            -backend-config="sas_token=${AZURE_STORAGE_SAS_TOKEN}"

      - name: Ensure Remote State Exists (import if missing)
        run: |
          echo "🔎 Checking if remote terraform.tfstate exists..."
          az storage blob show \
            --account-name ${AZURE_STORAGE_ACCOUNT} \
            --container-name ${AZURE_STORAGE_CONTAINER} \
            --name ${AZURE_STORAGE_KEY} \
            --sas-token ${AZURE_STORAGE_SAS_TOKEN} \
            || (
              echo "⚠️  State file not found. Importing existing Azure resources to initialize remote tfstate..."
              terraform import azurerm_virtual_network.vnet "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/rg-espana-dev-001/providers/Microsoft.Network/virtualNetworks/vnet-fco" || true
              terraform import azurerm_network_security_group.subnet_nsg "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/rg-espana-dev-001/providers/Microsoft.Network/networkSecurityGroups/nsg-ubuntu-n8n" || true
              terraform import azurerm_availability_set.n8n_asg "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/rg-espana-dev-001/providers/Microsoft.Compute/availabilitySets/as-n8n" || true
              terraform import azurerm_public_ip.ubuntu_pip "/subscriptions/${ARM_SUBSCRIPTION_ID}/resourceGroups/rg-espana-dev-001/providers/Microsoft.Network/publicIPAddresses/pip-ubuntu-n8n" || true
            )

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        continue-on-error: false

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan