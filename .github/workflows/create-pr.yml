name: Crear rama y Pull Request automático

on:
  workflow_dispatch:   # permite lanzarlo manualmente

permissions:
  contents: write
  pull-requests: write

jobs:
  create_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v6

      - name: Crear Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GIHUB_API }}
          branch: feature/github-actions-deploy
          base: main
          commit-message: "Add Terraform deploy workflow and secure variables"
          title: "Add Terraform deploy workflow and secure variables"
          body: |
            Este PR agrega:
            - Workflow de despliegue Terraform (`terraform-deploy.yml`)
            - Variable `admin_password` sensible
            - Documentación (`README-DEPLOY.md`)

      - name: Mostrar resultado
        if: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          echo "Pull request creada: ${{ steps.create-pr.outputs.pull-request-url }}"
