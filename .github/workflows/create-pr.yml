name: Crear Pull Request desde la rama seleccionada

on:
  workflow_dispatch:   # permite lanzarlo manualmente

permissions:
  contents: read
  pull-requests: write

jobs:
  create_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Crear Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: main
        run: |
          if [ "$HEAD_BRANCH" = "$BASE_BRANCH" ]; then
            echo "::error::Ejecuta este workflow seleccionando una rama distinta de main."
            exit 1
          fi

          existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --json url --jq '.[0].url')
          if [ -n "$existing_pr" ]; then
            echo "Ya existe una pull request: $existing_pr"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH" \
              --title "Cambios de infraestructura" \
              --body "Pull request generada para revisar los cambios de la rama $HEAD_BRANCH."
          fi
